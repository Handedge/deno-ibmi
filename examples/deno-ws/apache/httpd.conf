# DENOWS - IBM HTTP Server (Apache) instance acting as an HTTPS reverse proxy in front of Deno
# (same model as NODEWS for Node.js). Apache terminates TLS on *:3443 and
# forwards to Deno on 127.0.0.1:3081.
# Certificate: DCM application ID QIBM_HTTP_SERVER_DENOWS, certificate
# "deno-ibmi-ibmi" (CN=ibmi, SAN 192.0.2.82) imported into *SYSTEM,
# issued by the local deno-ibmi CA (/QOpenSys/opt/denoibmi/tls).
LoadModule ibm_ssl_module /QSYS.LIB/QHTTPSVR.LIB/QZSRVSSL.SRVPGM
LoadModule proxy_module /QSYS.LIB/QHTTPSVR.LIB/QZSRCORE.SRVPGM
LoadModule proxy_http_module /QSYS.LIB/QHTTPSVR.LIB/QZSRCORE.SRVPGM
DefaultNetCCSID 1208
Listen *:3443
ServerName ibmi
TraceEnable Off
ServerSignature Off
Options -FollowSymLinks
LogFormat "%h %T %l %u %t \"%r\" %>s %b" combined
CustomLog logs/access_log combined
ErrorLog logs/error_log
LogMaint logs/access_log 7 0
LogMaint logs/error_log 7 0
LogLevel warn
<Directory />
   Require all denied
</Directory>
# Reverse proxy only (never an open proxy)
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 60
<VirtualHost *:3443>
   SSLEngine On
   SSLAppName QIBM_HTTP_SERVER_DENOWS
   SSLProtocolDisable SSLv3 TLSv1 TLSv1.1
   ProxyPass / http://127.0.0.1:3081/
   ProxyPassReverse / http://127.0.0.1:3081/
</VirtualHost>
HTTPSubsystemDesc QHTTPSVR/QHTTPSVR
HTTPStartJobDesc QHTTPSVR/QZHBHTTP
HTTPStartJobQueue *JOBD
HTTPRoutingData *JOBD
